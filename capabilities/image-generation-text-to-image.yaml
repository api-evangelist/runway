naftiko: 1.0.0-alpha2
info:
  label: Runway Image Generation API — Text to Image
  description: 'Runway Image Generation API — Text to Image. 1 operations. Lead operation: Create text-to-image generation
    task. Self-contained Naftiko capability covering one Runway business surface.'
  tags:
  - Runway
  - Text to Image
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RUNWAY_API_KEY: RUNWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: image-generation-text-to-image
    baseUri: https://api.dev.runwayml.com/v1
    description: Runway Image Generation API — Text to Image business capability. Self-contained, no shared references.
    resources:
    - name: text_to_image
      path: /text_to_image
      operations:
      - name: createtexttoimage
        method: POST
        description: Create text-to-image generation task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.RUNWAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: image-generation-text-to-image-rest
    port: 8080
    description: REST adapter for Runway Image Generation API — Text to Image. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/text-to-image
      name: text-to-image
      description: REST surface for text_to_image.
      operations:
      - method: POST
        name: createtexttoimage
        description: Create text-to-image generation task
        call: image-generation-text-to-image.createtexttoimage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: image-generation-text-to-image-mcp
    port: 9090
    transport: http
    description: MCP adapter for Runway Image Generation API — Text to Image. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: create-text-image-generation-task
      description: Create text-to-image generation task
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: image-generation-text-to-image.createtexttoimage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
