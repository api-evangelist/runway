openapi: 3.2.0
info:
  title: Runway Video Generation Frame Interpolation API
  description: The Runway Video Generation API allows developers to generate videos from text prompts, images, or existing videos using Runway's Gen-4, Gen-4.5, Gen-4 Turbo, Aleph, and Veo models.
  version: '2024-11-06'
  contact:
    name: Runway Support
    url: https://support.runwayml.com/
  termsOfService: https://runwayml.com/terms-of-use
servers:
- url: https://api.dev.runwayml.com/v1
  description: Production Server
security:
- bearerAuth: []
tags:
- name: Frame Interpolation
  description: Interpolate between video frames to increase frame rate and smoothness.
paths:
  /frame_interpolation:
    post:
      operationId: createFrameInterpolation
      summary: Create frame interpolation task
      description: Starts a new asynchronous task to interpolate between video frames, increasing the frame rate and smoothness of the output video. Returns a task ID that can be polled for completion.
      tags:
      - Frame Interpolation
      parameters:
      - $ref: '#/components/parameters/RunwayVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameInterpolationRequest'
      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    TaskCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the created task. Use this ID to poll the task status endpoint.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A human-readable error message describing what went wrong.
        code:
          type: string
          description: A machine-readable error code identifying the type of error.
    FrameInterpolationRequest:
      type: object
      required:
      - model
      - videoUri
      properties:
        model:
          type: string
          description: The model to use for frame interpolation.
          enum:
          - frame_interpolation_v1
        videoUri:
          type: string
          description: An HTTPS URL or runway:// URI pointing to the video for frame interpolation.
  parameters:
    RunwayVersion:
      name: X-Runway-Version
      in: header
      required: true
      description: API version identifier. Must be set to the exact value 2024-11-06.
      schema:
        type: string
        enum:
        - '2024-11-06'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key passed via the HTTP Authorization header using the Bearer scheme. Obtain your API key from the Runway Developer Portal at https://dev.runwayml.com/.
externalDocs:
  description: Runway API Documentation
  url: https://docs.dev.runwayml.com/api/
