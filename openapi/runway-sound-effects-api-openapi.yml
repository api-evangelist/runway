openapi: 3.2.0
info:
  title: Runway Video Generation Sound Effects API
  description: The Runway Video Generation API allows developers to generate videos from text prompts, images, or existing videos using Runway's Gen-4, Gen-4.5, Gen-4 Turbo, Aleph, and Veo models.
  version: '2024-11-06'
  contact:
    name: Runway Support
    url: https://support.runwayml.com/
  termsOfService: https://runwayml.com/terms-of-use
servers:
- url: https://api.dev.runwayml.com/v1
  description: Production Server
security:
- bearerAuth: []
tags:
- name: Sound Effects
  description: Generate sound effects for videos using AI.
paths:
  /sound_effect:
    post:
      operationId: createSoundEffect
      summary: Create sound effect generation task
      description: Starts a new asynchronous task to generate sound effects for a video using AI. Returns a task ID that can be polled for completion.
      tags:
      - Sound Effects
      parameters:
      - $ref: '#/components/parameters/RunwayVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoundEffectRequest'
      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    RunwayVersion:
      name: X-Runway-Version
      in: header
      required: true
      description: API version identifier. Must be set to the exact value 2024-11-06.
      schema:
        type: string
        enum:
        - '2024-11-06'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A human-readable error message describing what went wrong.
        code:
          type: string
          description: A machine-readable error code identifying the type of error.
    SoundEffectRequest:
      type: object
      required:
      - model
      - promptText
      properties:
        model:
          type: string
          description: The model to use for sound effect generation.
          enum:
          - sound_effect_v1
        promptText:
          type: string
          description: A text description of the desired sound effect.
          maxLength: 1000
        videoUri:
          type: string
          description: An optional HTTPS URL or runway:// URI pointing to a video to generate sound effects for.
        duration:
          type: integer
          description: The duration of the generated sound effect in seconds.
    TaskCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the created task. Use this ID to poll the task status endpoint.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key passed via the HTTP Authorization header using the Bearer scheme. Obtain your API key from the Runway Developer Portal at https://dev.runwayml.com/.
externalDocs:
  description: Runway API Documentation
  url: https://docs.dev.runwayml.com/api/
