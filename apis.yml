apis:
- aid: runway:python-sdk
  name: Runway Python SDK
  description: >-
    The Runway Python SDK provides a convenient Python library for interacting with the Runway API. Supports
    Python 3.8+ with type annotations compatible with MyPy. Includes automatic retries, best-practice
    error handling, and type safety to simplify integration of Runway's video and image generation capabilities
    into Python applications.
  humanURL: https://docs.dev.runwayml.com/api-details/sdks/
  tags:
  - Python
  - SDK
  - Libraries
  - Artificial Intelligence
  - Video Generation
  properties:
  - type: Documentation
    url: https://docs.dev.runwayml.com/api-details/sdks/
  - type: GitHubRepository
    url: https://github.com/runwayml/sdk-python
- aid: runway:nodejs-sdk
  name: Runway Node.js SDK
  description: >-
    The Runway Node.js SDK provides a JavaScript and TypeScript library for integrating with the Runway
    API. Supports Node.js 18+ with TypeScript bindings, automatic retries, and best-practice error handling.
    Install via npm, yarn, or pnpm.
  humanURL: https://docs.dev.runwayml.com/api-details/sdks/
  tags:
  - Node.js
  - JavaScript
  - TypeScript
  - SDK
