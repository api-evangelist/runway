aid: runway
name: Runway
description: >-
  Runway is an applied AI research company that builds generative AI tools for creative professionals. Their developer
  platform provides APIs for video generation, image generation, real-time conversational avatar experiences, media
  uploads, and audio synthesis powered by advanced generative models including Gen-4, Gen-4 Turbo, Gen-4.5, Gen-4 Aleph,
  Veo 3.1, Act Two, and GWM-1 (General World Model). The API uses asynchronous task processing with Bearer token
  authentication.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
